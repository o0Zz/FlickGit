name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# A superseded `main` or PR run is wasted CI time; a tag run is a release and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: windows-latest

    env:
      SOLUTION: FlickGit.sln
      CONFIGURATION: Release
      STAGING: artifacts/FlickGit

      # Where the two files a release is cut from are assembled: the .msi and the portable .zip.
      RELEASE: artifacts/release

      # The release is tag-only. Computed once so the conditions cannot drift apart.
      IS_TAG: ${{ github.ref_type == 'tag' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Compute version from git
        id: version
        shell: pwsh
        run: |
          $describe = git describe --tags --long --match 'v*' 2>$null

          if ($LASTEXITCODE -eq 0 -and $describe -match '^v(\d+\.\d+\.\d+)-(\d+)-g[0-9a-f]+$') {
            $version = if ($matches[2] -eq '0') { $matches[1] } else { "{0}.{1}" -f $matches[1], $matches[2] }
          } else {
            $version = "0.0.0.$((git rev-list --count HEAD).Trim())"
          }

          $msiversion = ($version -split '\.')[0..2] -join '.'

          Write-Host "Version:   $version (git describe: $(if ($describe) { $describe } else { 'none' }))"
          Write-Host "Installer: $msiversion (ProductVersion)"

          "version=$version", "msiversion=$msiversion" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Build
        run: >
          dotnet build $env:SOLUTION
          -c $env:CONFIGURATION
          -p:ContinuousIntegrationBuild=true
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.version }}
          -p:FileVersion=${{ steps.version.outputs.version }}

      - name: Test
        run: >
          dotnet test tests/FlickGit.Core.Tests/FlickGit.Core.Tests.csproj
          -c $env:CONFIGURATION
          --no-build

      - name: Publish the payload
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $common = @(
            '-c', $env:CONFIGURATION, '-r', 'win-x64', '-o', $env:STAGING,
            '-p:DebugType=none',
            "-p:Version=$version", "-p:AssemblyVersion=$version", "-p:FileVersion=$version"
          )

          $payload = @(
            @{ Project = 'src/FlickGit.App/FlickGit.App.csproj'    # FlickGit.exe, the resident service
               Extra   = @('--self-contained', 'false', '-p:PublishSingleFile=true') }
            @{ Project = 'src/FlickGit.Shell/FlickGit.Shell.csproj'  # the shell handler explorer.exe loads
               Extra   = @() }
            @{ Project = 'src/FlickGit.Cli/FlickGit.Cli.csproj'      # flick.exe, the AOT stub
               Extra   = @() }
          )

          foreach ($item in $payload) {
            $arguments = @('publish', $item.Project) + $common + $item.Extra

            Write-Host "::group::publish $($item.Project)"
            dotnet @arguments
            Write-Host '::endgroup::'

            if ($LASTEXITCODE -ne 0) { throw "Publish failed: $($item.Project)" }
          }

      # ---------------------------------------------------------------------------------------

      - name: Assemble the release
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'

          New-Item -ItemType Directory -Force $env:RELEASE | Out-Null

          dotnet build src/FlickGit.Setup/FlickGit.Setup.wixproj `
            -c $env:CONFIGURATION `
            -p:Version=${{ steps.version.outputs.msiversion }} `
            -p:PackageDisplayVersion=$version `
            -p:SkipPayloadPublish=true `
            -p:PayloadDir="$((Resolve-Path $env:STAGING).Path)"

          if ($LASTEXITCODE -ne 0) { throw "The WiX build failed." }

          # Found rather than named: the WiX SDK puts its output under a culture subdirectory, and
          # a hard-coded path here would be a second place that has to know the version.
          $msi = Get-ChildItem src/FlickGit.Setup/bin -Recurse -Filter *.msi |
                   Sort-Object LastWriteTime -Descending | Select-Object -First 1

          if (-not $msi) { throw "The WiX build produced no .msi." }

          Copy-Item $msi.FullName $env:RELEASE
          Write-Host "Installer: $($msi.Name) ($([Math]::Round($msi.Length / 1MB, 1)) MB)"
          "msi=$env:RELEASE/$($msi.Name)" | Out-File $env:GITHUB_ENV -Append

          if ($env:IS_TAG -eq 'true') {
            $zip = "$env:RELEASE/FlickGit-$version.zip"
            Compress-Archive -Path "$env:STAGING/*" -DestinationPath $zip -Force
            "zip=$zip" | Out-File $env:GITHUB_ENV -Append
          }

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: FlickGit-${{ steps.version.outputs.version }}-installer
          path: ${{ env.msi }}
          if-no-files-found: error

      # The staging directory itself rather than the zip: GitHub is going to zip whatever this
      # points at, so uploading the .zip would make the portable build an archive inside an archive.
      - name: Upload the portable build
        uses: actions/upload-artifact@v4
        with:
          name: FlickGit-${{ steps.version.outputs.version }}-portable
          path: ${{ env.STAGING }}
          if-no-files-found: error

      # Both assets. The MSI is the way in; the zip stays for the portable install, which is the
      # one that works without touching Explorer or the registry at all.
      - name: Draft GitHub Release
        if: env.IS_TAG == 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ env.zip }}
            ${{ env.msi }}

  # ------------------------------------------------------------------------------------------------
  # macOS.
  #
  # This job exists because the macOS half of the product cannot be verified anywhere else: the
  # Swift Finder Sync extension needs a Swift toolchain, `lipo` and `codesign` are macOS-only, and
  # the .NET side had until now only ever been cross-compiled rather than run. A hosted runner has
  # all three, so what was unverifiable becomes a build log.
  #
  # It does not sign for distribution. `bundle.sh` falls back to an ad-hoc signature, which is
  # enough for `codesign --verify` to accept the bundle's structure but not enough for Finder to
  # load the extension on another machine -- that needs a notarised Developer ID signature, and the
  # secret for it is deliberately not assumed to exist.
  # ------------------------------------------------------------------------------------------------
  macos:
    runs-on: macos-latest

    env:
      CONFIGURATION: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Version
        id: version
        run: |
          describe=$(git describe --tags --long --match 'v*' 2>/dev/null || true)

          if [[ "$describe" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)-g[0-9a-f]+$ ]]; then
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          else
            version="0.0.0.$(git rev-list --count HEAD)"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version (git describe: ${describe:-none})"

      # The one thing this job shares with the Windows one, and the reason it is worth running here
      # too: FlickGit.Core is the only tested assembly, and until now its tests had only ever been
      # run on Windows. Every path assumption in it was written for a case-insensitive volume.
      #
      # The failures are re-emitted as a workflow annotation, and that is deliberate rather than
      # decorative: a job log needs a token to read, and annotations do not. Without this a red
      # build says only "exit code 1" to anything but a browser.
      - name: Test FlickGit.Core on macOS
        run: |
          set +e
          dotnet test tests/FlickGit.Core.Tests/FlickGit.Core.Tests.csproj \
            -c $CONFIGURATION --nologo --logger "console;verbosity=normal" > test.log 2>&1
          status=$?
          set -e

          tail -40 test.log

          if [ $status -ne 0 ]; then
            # One annotation holding every failure, with newlines encoded the way the workflow
            # command syntax requires.
            detail=$(grep -E "^\s*(Failed|Assert\.|Expected|Actual|Error Message)" test.log | head -80)
            encoded=$(printf '%s' "$detail" | python3 -c "import sys; print(sys.stdin.read().replace('%','%25').replace(chr(13),'').replace(chr(10),'%0A'))")
            echo "::error title=macOS Core test failures::$encoded"
          fi

          exit $status

      - name: Publish for osx-arm64 and osx-x64
        run: |
          version=${{ steps.version.outputs.version }}

          for rid in osx-arm64 osx-x64; do
            for project in FlickGit.App.Mac FlickGit.App.Mac.Cli; do
              dotnet publish "src/$project/$project.csproj" \
                -c $CONFIGURATION -r $rid --self-contained false \
                -p:DebugType=none \
                -p:Version=$version -p:AssemblyVersion=$version -p:FileVersion=$version \
                -o "artifacts/$rid" --nologo
            done
          done

      # Compiled on its own before the bundle, so a Swift error is reported as a Swift error rather
      # than as a bundle that failed to assemble.
      - name: Compile the Finder Sync extension
        run: |
          swiftc -target arm64-apple-macos12.0 \
            -module-name FlickGitFinder \
            -framework Cocoa -framework FinderSync \
            -typecheck src/FlickGit.FinderSync/FinderSync.swift

      - name: Assemble FlickGit.app
        run: |
          chmod +x src/FlickGit.Setup.Mac/bundle.sh
          src/FlickGit.Setup.Mac/bundle.sh \
            ${{ steps.version.outputs.version }} \
            artifacts/osx-arm64 \
            artifacts/osx-x64 \
            artifacts/mac

      # Proof the bundle is what it claims to be: the layout is right, the extension is inside it,
      # both architectures are present, and the signature covers it.
      - name: Inspect the bundle
        run: |
          APP=artifacts/mac/FlickGit.app

          echo "--- layout"
          find "$APP" -maxdepth 3 -type d | sort

          echo "--- architectures"
          lipo -info "$APP/Contents/MacOS/FlickGit" || true
          lipo -info "$APP/Contents/MacOS/flick" || true
          lipo -info "$APP/Contents/PlugIns/FlickGitFinder.appex/Contents/MacOS/FlickGitFinder"

          echo "--- signature"
          codesign -dv --verbose=2 "$APP" 2>&1 | head -20

          echo "--- plists parse"
          plutil -lint "$APP/Contents/Info.plist"
          plutil -lint "$APP/Contents/PlugIns/FlickGitFinder.appex/Contents/Info.plist"

      # The CLI actually runs here, which is the first time any of this executes on macOS.
      - name: Run flick against a real repository
        run: |
          FLICK=artifacts/mac/FlickGit.app/Contents/MacOS/flick

          echo "--- version"; "$FLICK" version
          echo "--- help";    "$FLICK" help | head -5
          echo "--- status";  "$FLICK" status .
          echo "--- language"; "$FLICK" language

          echo "--- a path with a space and a non-ASCII character"
          mkdir -p "/tmp/flick tést/repo" && cd "/tmp/flick tést/repo"
          git init -q . && git config user.email ci@example.com && git config user.name CI
          echo hello > a.txt && git add a.txt && git commit -qm "first"
          "$GITHUB_WORKSPACE/$FLICK" status .

      - name: Upload the app bundle
        uses: actions/upload-artifact@v4
        with:
          name: FlickGit-macos
          path: artifacts/mac/FlickGit.app
          if-no-files-found: error
