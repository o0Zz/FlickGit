name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      SOLUTION: FlickGit.sln
      CONFIGURATION: Release
      STAGING: artifacts/FlickGit

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Unshallow: the version below comes from `git describe`, which needs the tags and
          # the commits between them.
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Compute version from git
        id: version
        shell: pwsh
        run: |
          # The fourth field always counts commits, so every build is distinguishable from
          # every other one and a dev build is ordered after the release it follows. The
          # first three fields say which release that is, and are 0.0.0 until there is one.
          #
          #   at tag v1.2.3          -> 1.2.3.0
          #   4 commits past it      -> 1.2.3.4
          #   no tag in the history  -> 0.0.0.<commits since the root>
          #
          # Tag and branch builds run the same computation on purpose: `git describe` reads
          # HEAD either way, so a tag build is just the case where the count happens to be 0.
          $describe = git describe --tags --long --match 'v*' 2>$null

          if ($LASTEXITCODE -eq 0 -and $describe -match '^v(\d+\.\d+\.\d+)-(\d+)-g[0-9a-f]+$') {
            $version = "{0}.{1}" -f $matches[1], $matches[2]
          } else {
            # No v* tag reachable from HEAD -- the repository has never been released, or
            # this branch predates the first tag. Count from the root instead, which is the
            # same rule with an implied v0.0.0 at the beginning of history.
            $commits = (git rev-list --count HEAD).Trim()
            $version = "0.0.0.$commits"
          }

          Write-Host "Computed version: $version (git describe: $(if ($describe) { $describe } else { 'none' }))"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore
        run: dotnet restore $env:SOLUTION

      # All three version properties are set: the About box and `flick --version` read
      # AssemblyVersion, the file properties dialog reads FileVersion, and NuGet-style
      # tooling reads Version. There is no AssemblyInfo.cs to patch -- the SDK generates the
      # attributes, so they arrive as properties.
      - name: Build
        run: >
          dotnet build $env:SOLUTION
          -c $env:CONFIGURATION
          --no-restore
          -p:ContinuousIntegrationBuild=true
          -p:AssemblyVersion=${{ steps.version.outputs.version }}
          -p:FileVersion=${{ steps.version.outputs.version }}
          -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: >
          dotnet test tests/FlickGit.Core.Tests/FlickGit.Core.Tests.csproj
          -c $env:CONFIGURATION
          --no-build
          --logger "trx;LogFileName=core-tests.trx"
          --results-directory artifacts/test-results

      # Two publishes into one directory, because the product is two executables that have to
      # sit beside each other: ShellIntegration writes "<install>\flick.exe" into the registry
      # and flick.exe looks for FlickGit.exe next to itself.
      #
      # The App is framework-dependent: it pays WPF startup once at logon and stays resident,
      # so bundling a copy of the runtime would buy nothing at the only moment that matters.
      - name: Publish FlickGit.exe (WPF app)
        run: >
          dotnet publish src/FlickGit.App/FlickGit.App.csproj
          -c $env:CONFIGURATION
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:DebugType=none
          -p:AssemblyVersion=${{ steps.version.outputs.version }}
          -p:FileVersion=${{ steps.version.outputs.version }}
          -p:Version=${{ steps.version.outputs.version }}
          -o $env:STAGING

      # Native AOT. windows-latest carries the MSVC toolchain the ILC linker needs; a machine
      # without it can still `dotnet build` the repo, it just cannot produce this binary.
      - name: Publish flick.exe (Native AOT stub)
        run: >
          dotnet publish src/FlickGit.Cli/FlickGit.Cli.csproj
          -c $env:CONFIGURATION
          -r win-x64
          -p:DebugType=none
          -p:AssemblyVersion=${{ steps.version.outputs.version }}
          -p:FileVersion=${{ steps.version.outputs.version }}
          -p:Version=${{ steps.version.outputs.version }}
          -o $env:STAGING

      # The layout is a contract, not a convention: the registry command lines point at
      # flick.exe by path and at icons\*.ico by path, so a publish that renamed or nested
      # either one would install a context menu whose entries silently do nothing.
      - name: Verify the published layout
        shell: pwsh
        run: |
          # Every icon the registry integration names by path. A missing one is a context menu
          # entry with no glyph, which nothing else in the build would notice.
          $required = @(
            'FlickGit.exe',
            'flick.exe',
            'Resources\flickgit.ico',
            'icons\branch.ico',
            'icons\clone.ico',
            'icons\commit.ico',
            'icons\pull.ico',
            'icons\push.ico',
            'icons\status.ico',
            'icons\terminal.ico'
          )

          $missing = $required | Where-Object { -not (Test-Path (Join-Path $env:STAGING $_)) }
          if ($missing) {
            Write-Host "::error::Missing from the published output: $($missing -join ', ')"
            exit 1
          }

          # Both publishes pass DebugType=none. Symbols are not part of the install, and a
          # released zip that carries them ships source paths and private type layout in
          # exchange for nothing the user can do with them.
          $symbols = Get-ChildItem $env:STAGING -Recurse -File -Filter *.pdb
          if ($symbols) {
            Write-Host "::error::Symbols in the published output: $($symbols.Name -join ', ')"
            exit 1
          }

          # The AOT stub is the whole reason for the two-process split. A framework-dependent
          # build of it would still run, and would still be 50-100 ms slower on every
          # right-click, which is exactly the regression nobody would notice by hand.
          $stub = Get-Item (Join-Path $env:STAGING 'flick.exe')
          Write-Host ("flick.exe: {0:N0} bytes" -f $stub.Length)
          if ($stub.Length -lt 200KB) {
            Write-Host "::error::flick.exe is $($stub.Length) bytes -- too small to be a Native AOT binary. Check that PublishAot survived."
            exit 1
          }

          Get-ChildItem $env:STAGING -Recurse -File |
            Select-Object @{ n = 'Path'; e = { $_.FullName.Substring((Resolve-Path $env:STAGING).Path.Length + 1) } }, Length |
            Sort-Object Path |
            Format-Table -AutoSize

      # The published layout, not an archive of it. actions/upload-artifact always zips what
      # it is handed, so handing it a .zip is what produced a zip inside a zip -- give it the
      # directory and the download is the layout, one level down.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlickGit-${{ steps.version.outputs.version }}
          path: ${{ env.STAGING }}
          if-no-files-found: error

      # A release asset is a file rather than an upload-artifact upload, so this archive is a
      # real one and nothing zips it a second time. Tag builds only -- it exists for the
      # release step below and has no other consumer.
      - name: Package the release asset
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $zip = "artifacts/FlickGit-${{ steps.version.outputs.version }}.zip"
          Compress-Archive -Path "$env:STAGING/*" -DestinationPath $zip -Force
          "zip=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: ignore

      - name: Draft GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: ${{ env.zip }}
